name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and republish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.release_tag || github.ref }}

jobs:
  check:
    name: Verify tagged source
    uses: ./.github/workflows/check.yml
    with:
      checkout_ref: ${{ inputs.release_tag || github.ref }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      verify_release_version: true

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # Linux and Windows builds pin the baseline instruction set, for Go
    # (go_cpu) and for the C code cgo compiles (march), so a library built on
    # a recent runner loads without SIGILL on older CPUs and virtual machines.
    # macOS builds keep the toolchain defaults, which target the oldest CPUs
    # each macOS architecture supports.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            os: darwin
            arch: amd64
            extension: dylib
          - target: darwin-arm64
            runner: macos-latest
            os: darwin
            arch: arm64
            extension: dylib
          - target: linux-amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            extension: so
            image: quay.io/pypa/manylinux2014_x86_64
            go_cpu: GOAMD64=v1
            march: x86-64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            extension: so
            image: quay.io/pypa/manylinux2014_aarch64
            go_cpu: GOARM64=v8.0
            march: armv8-a
          - target: windows-amd64
            runner: windows-2025
            os: windows
            arch: amd64
            extension: dll
            cc: gcc
            cc_target: x86_64-w64-mingw32
            go_cpu: GOAMD64=v1
            march: x86-64
            objdump: objdump
            cache_salt: runner-ucrt-gcc
          - target: windows-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            extension: dll
            cc: aarch64-w64-mingw32-gcc
            cc_target: aarch64-w64-windows-gnu
            go_cpu: GOARM64=v8.0
            march: armv8-a
            objdump: llvm-objdump
            cache_salt: llvm-mingw-20260616

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify native runner architecture
        if: matrix.os != 'windows'
        run: |
          test "$(go env GOOS)" = "${{ matrix.os }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"

      - name: Verify native Windows runner architecture
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if ((go env GOOS) -ne $env:TARGET_OS) {
            throw "Expected GOOS=$($env:TARGET_OS), got $(go env GOOS)"
          }
          if ((go env GOARCH) -ne $env:TARGET_ARCH) {
            throw "Expected GOARCH=$($env:TARGET_ARCH), got $(go env GOARCH)"
          }

      - name: Restore manylinux build cache
        if: matrix.os == 'linux'
        uses: actions/cache@v5
        with:
          path: .cache/manylinux-${{ matrix.arch }}
          key: manylinux2014-${{ matrix.arch }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go', 'internal/plugin/web/**') }}
          restore-keys: |
            manylinux2014-${{ matrix.arch }}-

      - name: Restore Windows ARM64 CGO toolchain
        id: windows-arm64-toolchain
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/llvm-mingw-20260616-ucrt-aarch64
          key: llvm-mingw-windows-arm64-20260616-312593669435bd0b

      - name: Set up Windows ARM64 CGO toolchain
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $toolchainVersion = "20260616"
          $archiveName = "llvm-mingw-$toolchainVersion-ucrt-aarch64.zip"
          $expectedSha256 = "312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $toolchainRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-$toolchainVersion-ucrt-aarch64"
          $downloadUrl = "https://github.com/mstorsjo/llvm-mingw/releases/download/$toolchainVersion/$archiveName"

          if ("${{ steps.windows-arm64-toolchain.outputs.cache-hit }}" -ne "true") {
            Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
            $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "llvm-mingw checksum mismatch: expected $expectedSha256, got $actualSha256"
            }
            Expand-Archive -Path $archivePath -DestinationPath $env:RUNNER_TEMP -Force
          }

          $binDirectory = Join-Path $toolchainRoot "bin"
          $compiler = Join-Path $binDirectory "aarch64-w64-mingw32-gcc.exe"
          if (-not (Test-Path $compiler -PathType Leaf)) {
            throw "Windows ARM64 compiler not found after extraction: $compiler"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $binDirectory -Encoding utf8
          & $compiler --version

      - name: Save Windows ARM64 CGO toolchain
        if: matrix.os == 'windows' && matrix.arch == 'arm64' && steps.windows-arm64-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/llvm-mingw-20260616-ucrt-aarch64
          key: llvm-mingw-windows-arm64-20260616-312593669435bd0b

      - name: Restore Windows Go build cache
        id: windows-go-build-cache
        if: matrix.os == 'windows'
        uses: actions/cache/restore@v5
        with:
          path: ~/AppData/Local/go-build
          key: windows-go-build-${{ matrix.arch }}-${{ matrix.cache_salt }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go', 'internal/plugin/web/**') }}
          restore-keys: |
            windows-go-build-${{ matrix.arch }}-${{ matrix.cache_salt }}-

      - name: Build macOS plugin
        if: matrix.os == 'darwin'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH="$TARGET_ARCH" \
            go build -buildvcs=false -tags cshared -buildmode=c-shared \
            -o dist/cpa-super-billing.dylib ./cmd/cpa-super-billing
          rm -f dist/cpa-super-billing.h

      - name: Build Linux plugin with manylinux2014
        if: matrix.os == 'linux'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_IMAGE: ${{ matrix.image }}
          TARGET_GO_CPU: ${{ matrix.go_cpu }}
          TARGET_MARCH: ${{ matrix.march }}
        run: |
          mkdir -p dist
          go_root="$(go env GOROOT)"
          cache_root="$GITHUB_WORKSPACE/.cache/manylinux-${TARGET_ARCH}"
          mkdir -p "$cache_root/build" "$cache_root/mod"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$go_root:/opt/go:ro" \
            -e HOME=/tmp -e GOROOT=/opt/go -e TARGET_ARCH -e TARGET_GO_CPU -e TARGET_MARCH \
            -e GOCACHE="/src/.cache/manylinux-${TARGET_ARCH}/build" \
            -e GOMODCACHE="/src/.cache/manylinux-${TARGET_ARCH}/mod" \
            "$TARGET_IMAGE" \
            bash -euo pipefail -c '
              export PATH="$GOROOT/bin:$PATH"
              export "${TARGET_GO_CPU:?}" CGO_CFLAGS="-O2 -g -march=${TARGET_MARCH:?}"
              CGO_ENABLED=1 GOOS=linux GOARCH="$TARGET_ARCH" \
                go build -buildvcs=false -trimpath -ldflags="-s -w -buildid=" \
                -tags cshared -buildmode=c-shared \
                -o dist/cpa-super-billing.so ./cmd/cpa-super-billing
            '
          rm -f dist/cpa-super-billing.h

      - name: Build Windows plugin
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_CC: ${{ matrix.cc }}
          EXPECTED_CC_TARGET: ${{ matrix.cc_target }}
          TARGET_GO_CPU: ${{ matrix.go_cpu }}
          TARGET_MARCH: ${{ matrix.march }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $env:TARGET_CC --version
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to run Windows compiler: $env:TARGET_CC"
          }
          $compilerTarget = (& $env:TARGET_CC -dumpmachine).Trim()
          if ($compilerTarget -ne $env:EXPECTED_CC_TARGET) {
            throw "Expected compiler target $env:EXPECTED_CC_TARGET, got $compilerTarget"
          }

          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = $env:TARGET_ARCH
          $env:CC = $env:TARGET_CC
          $goCpuName, $goCpuValue = $env:TARGET_GO_CPU -split '=', 2
          if (-not $goCpuName -or -not $goCpuValue -or -not $env:TARGET_MARCH) {
            throw "Missing CPU baseline for $($env:TARGET_ARCH)"
          }
          Set-Item -Path "Env:$goCpuName" -Value $goCpuValue
          $env:CGO_CFLAGS = "-O2 -g -march=$($env:TARGET_MARCH)"
          go build -buildvcs=false -trimpath -ldflags="-s -w -buildid=" `
            -tags cshared -buildmode=c-shared `
            -o dist/cpa-super-billing.dll ./cmd/cpa-super-billing
          if ($LASTEXITCODE -ne 0) {
            throw "Windows plugin build failed"
          }
          Remove-Item dist/cpa-super-billing.h -Force -ErrorAction SilentlyContinue

      - name: Save Windows Go build cache
        if: matrix.os == 'windows' && steps.windows-go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/AppData/Local/go-build
          key: windows-go-build-${{ matrix.arch }}-${{ matrix.cache_salt }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go', 'internal/plugin/web/**') }}

      - name: Verify and package Unix plugin
        if: matrix.os != 'windows'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
          TARGET_GO_CPU: ${{ matrix.go_cpu }}
        run: |
          binary="dist/cpa-super-billing.${EXTENSION}"
          test -s "$binary"
          file "$binary"
          if [ -n "$TARGET_GO_CPU" ]; then
            go version -m "$binary" | grep -Eq "^[[:space:]]*build[[:space:]]+${TARGET_GO_CPU}\$"
          fi
          version="${RELEASE_TAG#v}"

          release_archive="cpa-super-billing_${version}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          tar -czf "$release_archive" -C dist "cpa-super-billing.${EXTENSION}"

          store_archive="cpa-super-billing_${version}_${TARGET_OS}_${TARGET_ARCH}.zip"
          zip -j "$store_archive" "$binary"
          test "$(unzip -Z1 "$store_archive")" = "cpa-super-billing.${EXTENSION}"

      - name: Verify and package Windows plugin
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
          TARGET_OBJDUMP: ${{ matrix.objdump }}
          TARGET_GO_CPU: ${{ matrix.go_cpu }}
        run: |
          $binary = "dist/cpa-super-billing.$($env:EXTENSION)"
          if (-not (Test-Path $binary) -or (Get-Item $binary).Length -eq 0) {
            throw "Missing or empty plugin binary: $binary"
          }
          Get-Item $binary

          $buildInfo = go version -m $binary
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read the plugin build information"
          }
          if (-not ($buildInfo | Select-String -Pattern "^\s*build\s+$([regex]::Escape($env:TARGET_GO_CPU))$" -Quiet)) {
            throw "Plugin binary was not built with $($env:TARGET_GO_CPU)"
          }

          $exports = & $env:TARGET_OBJDUMP -p $binary
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect plugin binary with $env:TARGET_OBJDUMP"
          }
          if (-not ($exports | Select-String -Pattern "\bcliproxy_plugin_init\b" -Quiet)) {
            throw "Plugin binary does not export cliproxy_plugin_init"
          }
          $version = $env:RELEASE_TAG -replace '^v', ''

          $storeArchive = "cpa-super-billing_$($version)_$($env:TARGET_OS)_$($env:TARGET_ARCH).zip"
          Compress-Archive -Path $binary -DestinationPath $storeArchive -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($storeArchive)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries.Count -ne 1 -or $entries[0] -ne "cpa-super-billing.$($env:EXTENSION)") {
              throw "Unexpected archive contents: $($entries -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            cpa-super-billing_*_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            cpa-super-billing_*_${{ matrix.os }}_${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - check
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum cpa-super-billing_*.tar.gz cpa-super-billing_*.zip | sort > checksums.txt

      - name: Extract release notes
        run: |
          awk -v heading="## $RELEASE_TAG" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' Changelog.md > release-assets/RELEASE_NOTES.md
          test -s release-assets/RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt
          fail_on_unmatched_files: true
          overwrite_files: true
